<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Определяем круглую маску -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>

  <!-- Группа с маской -->
  <g clip-path="url(#circleClip)">
    <!-- Белая полоса -->
    <rect x="0" y="0" width="100" height="33.33" fill="#FFFFFF" />
    <!-- Синяя полоса -->
    <rect x="0" y="33.33" width="100" height="33.33" fill="#0033A0" />
    <!-- Красная полоса -->
    <rect x="0" y="66.66" width="100" height="33.33" fill="#DA291C" />
  </g>
</svg>