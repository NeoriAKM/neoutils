<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- 7 красных и 6 белых полос (всего 13) -->
    <!-- Делим 100% высоты на 13 полос: 100 / 13 = 7.692% на одну полосу -->
    
    <!-- Полоса 1 (Красная) -->
    <rect x="0" y="0" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 2 (Белая) -->
    <rect x="0" y="7.692" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 3 (Красная) -->
    <rect x="0" y="15.384" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 4 (Белая) -->
    <rect x="0" y="23.076" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 5 (Красная) -->
    <rect x="0" y="30.768" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 6 (Белая) -->
    <rect x="0" y="38.460" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 7 (Красная) -->
    <rect x="0" y="46.152" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 8 (Белая) -->
    <rect x="0" y="53.844" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 9 (Красная) -->
    <rect x="0" y="61.536" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 10 (Белая) -->
    <rect x="0" y="69.228" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 11 (Красная) -->
    <rect x="0" y="76.920" width="100" height="7.692" fill="#B22234" />
    <!-- Полоса 12 (Белая) -->
    <rect x="0" y="84.612" width="100" height="7.692" fill="#FFFFFF" />
    <!-- Полоса 13 (Красная) -->
    <rect x="0" y="92.304" width="100" height="7.692" fill="#B22234" />

    <!-- Синий кантон (левый верхний угол) -->
    <!-- Традиционно занимает 2/5 ширины и 7/13 высоты -->
    <rect x="0" y="0" width="40" height="53.846" fill="#3C3B6E" />
  </g>
</svg>